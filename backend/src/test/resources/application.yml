spring:
  datasource:
    # H2 記憶體資料庫，MODE=MySQL 讓語法相容專案原本寫給 MySQL 的 SQL
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_UPPER=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always   # 每次啟動測試都重新執行 schema.sql，確保資料表是乾淨的
  jackson:
    property-naming-strategy: SNAKE_CASE   # 跟正式環境一致，不然測出來的 JSON 命名會跟真實 API 不一樣
    serialization:
      write-dates-as-timestamps: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
